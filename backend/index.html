<!DOCTYPE html>
<html>
<head>
    <title>Staff Attendance Portal</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
        }

        .cards{
            display:flex;
            justify-content:center;
            gap:20px;
            margin:30px;
        }

        .card{
            background:white;
            padding:20px;
            width:150px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        form{
            background:white;
            padding:20px;
            width:300px;
            margin:auto;
            border-radius:10px;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            padding:10px;
            background:blue;
            color:white;
            border:none;
        }

        table{
            width:80%;
            margin:30px auto;
            border-collapse: collapse;
        }

        th, td{
            border:1px solid black;
            padding:10px;
        }

        th{
            background:blue;
            color:white;
        }
    </style>
</head>

<body>

<h1>Staff Attendance Portal</h1>

<!-- DASHBOARD -->
<div class="cards">
    <div class="card">
        <h3>Total</h3>
        <p id="total">21</p>
    </div>

    <div class="card">
        <h3>Present</h3>
        <p id="present">12</p>
    </div>

    <div class="card">
        <h3>Absent</h3>
        <p id="absent">5</p>
    </div>

    <div class="card">
        <h3>Leave</h3>
        <p id="leave">4</p>
    </div>
</div>

<!-- FORM -->
<form onsubmit="addAttendance(event)">
    <input type="text" id="name" placeholder="Enter Name" required>
    <input type="date" id="date" required>
    <input type="text" id="status" placeholder="Present/Absent/Leave" required>
    <button>Add Attendance</button>
</form>

<br>

<a href="/export"><button style="background:green;">Export CSV</button></a>

<!-- TABLE -->
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Date</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody id="tableBody"></tbody>
</table>

<script>

// LOAD DASHBOARD
function loadDashboard(){
    fetch("/dashboard")
    .then(res => res.json())
    .then(data => {
        document.getElementById("total").innerText = data.total_records;
        document.getElementById("present").innerText = data.present;
        document.getElementById("absent").innerText = data.absent;
        document.getElementById("leave").innerText = data.leave;
    });
}

// LOAD TABLE
function loadTable(){
    fetch("/view")
    .then(res => res.json())
    .then(data => {

        let table = document.getElementById("tableBody");
        table.innerHTML = "";

        data.data.forEach(row => {
            let tr = `
            <tr>
                <td>${row[0]}</td>
                <td>${row[1]}</td>
                <td>${row[2]}</td>
                <td>${row[3]}</td>
            </tr>
            `;
            table.innerHTML += tr;
        });
    });
}

// ADD ATTENDANCE
function addAttendance(e){
    e.preventDefault();

    let name = document.getElementById("name").value;
    let date = document.getElementById("date").value;
    let status = document.getElementById("status").value;

    fetch("/attendance", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `name=${name}&date=${date}&status=${status}`
    })
    .then(res => res.json())
    .then(() => {
        alert("Added!");
        loadDashboard();
        loadTable();
    });
}

// INITIAL LOAD
loadDashboard();
loadTable();

</script>

</body>
</html>
