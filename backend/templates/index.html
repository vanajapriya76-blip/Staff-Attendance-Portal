<!DOCTYPE html>
<html>
<head>
    <title>Staff Attendance Portal</title>
</head>

<body>

<h1>Staff Attendance Portal</h1>

<!-- DASHBOARD -->
<h2>Total: <span id="total">23</span></h2>
<h2>Present: <span id="present">12</span></h2>
<h2>Absent: <span id="absent">5</span></h2>
<h2>Leave: <span id="leave">4</span></h2>

<hr>

<!-- TABLE -->
<h2>Attendance Records</h2>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Date</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody id="tableBody">
    </tbody>
</table>

<script>

// DASHBOARD DATA
fetch("http://127.0.0.1:8000/dashboard")
.then(res => res.json())
.then(data => {
    document.getElementById("total").innerText = data.total_records;
    document.getElementById("present").innerText = data.present;
    document.getElementById("absent").innerText = data.absent;
    document.getElementById("leave").innerText = data.leave;
});

// TABLE DATA
fetch("http://127.0.0.1:8000/view")
.then(res => res.json())
.then(data => {

    let table = document.getElementById("tableBody");

    data.data.forEach(row => {

        let tr = `<tr>
            <td>${row[0]}</td>
            <td>${row[1]}</td>
            <td>${row[2]}</td>
            <td>${row[3]}</td>
        </tr>`;

        table.innerHTML += tr;
    });

});

</script>

</body>
</html>
